name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Tag oluşturulduğunda da çalışması için
  create:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore ./backend/TaskFlow.API/TaskFlow.API.csproj
    - name: Build
      run: dotnet build ./backend/TaskFlow.API/TaskFlow.API.csproj --no-restore
    # Tests can be added here
    # - name: Test
    #   run: dotnet test ./backend/TaskFlow.Tests/TaskFlow.Tests.csproj --no-build --verbosity normal

  build-vue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Build
      run: npm run build

  release-electron:
    needs: [build-dotnet, build-vue]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    # 1. Publish Backend for Electron inclusion
    - name: Publish Backend
      run: dotnet publish ../backend/TaskFlow.API/TaskFlow.API.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true

    # 2. Install Frontend Deps
    - name: Install Dependencies
      run: npm install

    # 3. Build Electron App (includes Vite build)
    - name: Build Desktop App
      run: npm run electron:build
      env:
        GH_TOKEN: ${{ secrets.TASKFLOW_TOKEN }}

    # 4. Upload Installer Artifact
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: TaskFlow-Setup
        path: frontend/dist/*.exe
